<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rook · Archive review</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#101314;color:#eef1ee}*{box-sizing:border-box}body{margin:0}header,main{max-width:1120px;margin:auto;padding:24px}header{border-bottom:1px solid #343c3a;display:flex;justify-content:space-between;gap:20px}h1{font-size:24px;margin:4px 0}h2{font-size:20px;margin:0}p{line-height:1.5}.muted{color:#a8b3af;font-size:14px}.eyebrow{font-size:12px;letter-spacing:.14em;color:#e7bb63}button,select{font:inherit;padding:10px 14px;border:1px solid #56605b;border-radius:6px;background:#1d2421;color:inherit}button{cursor:pointer}button:hover{border-color:#e7bb63}button:disabled{opacity:.4;cursor:default}.primary{background:#e7bb63;color:#171a18;border-color:#e7bb63}.toolbar,.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:20px}.photos{display:grid;grid-template-columns:1fr;gap:16px}figure{margin:0;background:#171d1a;padding:12px}img{display:block;width:100%;max-height:460px;object-fit:contain}figcaption{font-size:13px;color:#adb7b2;padding-top:8px}.actions{margin-top:24px}.title{display:flex;justify-content:space-between;gap:16px;margin:24px 0}#notice{color:#e7bb63;min-height:24px}#finish{padding:40px 0}select{max-width:100%}@media(min-width:900px){.photos.two{grid-template-columns:1fr 1fr}}
[hidden]{display:none!important}
</style></head><body>
<header><div><div class="eyebrow">ROOK / ARCHIVE</div><h1>Teach Rook what matters</h1><div class="muted">Review saved sightings. Your decisions are preserved; nothing trains automatically.</div></div><div id="progress" class="muted"></div></header>
<main><div class="toolbar"><label>Queue <select id="queue"><option value="cached_candidate">Suggested identities</option><option value="uncached_by_filename">Unscreened activity</option></select></label><label>Class <select id="filter"><option value="all">All classes</option></select></label><label><input type="checkbox" id="showSaved"> Include reviewed</label><button id="previous">Previous</button><button id="next">Next</button></div>
<div id="notice" role="status"></div><section id="item"><div class="title"><div><h2 id="label"></h2><p id="details" class="muted"></p></div><span id="position" class="muted"></span></div><div class="photos" id="photos"><figure><img id="original" alt="Original archived frame"><figcaption>Original frame</figcaption></figure><figure id="galleryFigure"><img id="gallery" alt="Existing review image"><figcaption>Existing review image · label suggestion may be wrong</figcaption></figure></div>
<div class="actions" id="candidateActions"><button class="primary" data-decision="approve">Label is correct</button><select id="correction" aria-label="Corrected class"></select><button data-decision="correct">Use this class</button><button data-decision="reject">Label is wrong</button><button data-decision="uncertain">Unsure</button></div>
<div class="actions" id="discoveryActions"><button class="primary" data-decision="interesting">Worth investigating</button><button data-decision="background">Looks like background</button><button data-decision="uncertain">Unsure</button></div><p class="muted" id="hint"></p></section>
<section id="finish" hidden><h2>This queue is reviewed</h2><p>Choose another queue or include reviewed items to revisit a decision.</p></section></main>
<script>
let state={items:[],decisions:{},classes:[]},position=0,current=null,loaded=false;
const $=id=>document.getElementById(id), pretty=s=>(s||'Unknown activity').replaceAll('_',' ');
function filtered(){return state.items.filter(x=>x.kind===$('queue').value&&($('filter').value==='all'||x.label===$('filter').value)&&($('showSaved').checked||!state.decisions[x.item_id]));}
function setButtons(enabled){document.querySelectorAll('[data-decision]').forEach(b=>b.disabled=!enabled);}
function show(){const items=filtered();position=Math.max(0,Math.min(position,items.length-1));current=items[position];$('progress').textContent=Object.keys(state.decisions).filter(id=>state.items.some(i=>i.item_id===id)).length+' / '+state.items.length+' decisions saved';$('item').hidden=!current;$('finish').hidden=!!current;if(!current)return;
loaded=false;setButtons(false);const isCandidate=current.kind==='cached_candidate';$('label').textContent=isCandidate?'Suggested: '+pretty(current.label):'Unscreened activity';$('details').textContent=(current.capture_time||'Capture time unavailable').replace('T',' · ')+' · '+current.source_filename;$('position').textContent=(position+1)+' of '+items.length;$('candidateActions').hidden=!isCandidate;$('discoveryActions').hidden=isCandidate;$('galleryFigure').hidden=!current.gallery_path;$('photos').classList.toggle('two',!!current.gallery_path);$('hint').textContent=isCandidate?'Judge the identity from the image. Rejecting this label does not declare the entire frame empty. Bounding boxes will be checked before training.':'A missed detection can still contain something useful. Background is a triage decision that requires validation before training.';
const id=current.item_id;for(const [view,img] of [['original',$('original')],['gallery',$('gallery')]]){img.onload=()=>{if(current&&current.item_id===id){loaded=true;setButtons(true);}};img.onerror=()=>{if(!loaded)$('notice').textContent='This image is unavailable. Try Next; no decision has been saved.';};if(view==='original'||current.gallery_path)img.src='/image?item='+encodeURIComponent(id)+'&view='+view;else img.removeAttribute('src');}
const saved=state.decisions[id];$('notice').textContent=saved?'Saved: '+pretty(saved.decision)+(saved.corrected_label?' → '+pretty(saved.corrected_label):''):'';
}
for(const id of ['queue','filter','showSaved'])$(id).onchange=()=>{position=0;show();};$('previous').onclick=()=>{position--;show();};$('next').onclick=()=>{position++;show();};
document.querySelectorAll('[data-decision]').forEach(button=>button.onclick=async()=>{if(!current||!loaded)return;setButtons(false);const item=current;try{const response=await fetch('/api/decisions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({item_id:item.item_id,decision:button.dataset.decision,corrected_label:$('correction').value})});const value=await response.json();if(!response.ok)throw new Error(value.error||'Save failed');state.decisions[item.item_id]=value;show();}catch(error){$('notice').textContent=error.message;setButtons(true);}});
fetch('/api/items').then(r=>{if(!r.ok)throw new Error('Open the private startup link to begin.');return r.json();}).then(value=>{state=value;for(const c of [...new Set(state.items.map(x=>x.label))].sort()){const option=new Option(pretty(c),c);$('filter').add(option);}for(const c of state.classes)$('correction').add(new Option(pretty(c),c));show();}).catch(error=>{$('notice').textContent=error.message;$('item').hidden=true;});
</script></body></html>
